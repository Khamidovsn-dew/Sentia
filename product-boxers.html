<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Detail – Empire Textile" />
    <title>Product Detail - Empire Textile</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <link rel="stylesheet" href="/css/product.css" />
    <link rel="icon" href="/images/favicon/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-layout">
      <!-- HEADER -->
      <div id="header"></div>

      <!-- PRODUCT DETAIL SECTION -->
      <section class="products-page">
        <div class="products-header">
          <h2>BOXERS</h2>
        </div>
      
        <div class="products-grid">
          <a href="#" class="product-card">
            <img src="images/new/boxiers/MAIN.jpg" alt="Eco Tote Bags" />
            <div class="card-footer">
              <span>BOXERS</span>
              <span class="arrow"></span>
            </div>
          </a>
      
          <a href="#" class="product-card">
            <img src="images/new/boxiers/1.jpg" alt="Bed Linen" />
            <div class="card-footer">
              <span>BOXERS BLACK</span>
              <span class="arrow"></span>
            </div>
          </a>
      
          <a href="#" class="product-card">
            <img src="images/new/boxiers/2.jpg" alt="Robes" />
            <div class="card-footer">
              <span>BOXERS MIX</span>
              <span class="arrow"></span>
            </div>
          </a>
      
          <a href="#" class="product-card">
            <img src="images/new/boxiers/3.jpg" alt="Towels" />
            <div class="card-footer">
              <span>BOXERS DARK BLUE</span>
              <span class="arrow"></span>
            </div>
          </a>
      
          <a href="#" class="product-card">
            <img src="images/new/boxiers/4.jpg" alt="Socks" />
            <div class="card-footer">
              <span>BOXER</span>
              <span class="arrow"></span>
            </div>
          </a>
      
          <a href="#" class="product-card">
            <img src="images/new/boxiers/5.jpg" alt="Boxer Briefs" />
            <div class="card-footer">
              <span>BOXERS</span>
              <span class="arrow"></span>
            </div>
          </a>
        </div>
      </section>
      

    <!-- FOOTER -->

    <div id="footer"></div>
   
    <script src="js/main.js"></script>

    <!-- Load Partials -->
    <script>
      fetch("partials/header.html")
    .then(res => res.text())
    .then(data => {
    document.getElementById("header").innerHTML = data;
    if (typeof setupHeader === "function") {
      setupHeader(); // 🟢 This runs all header logic (burger, lang, etc.)
    }
    });

      fetch("partials/footer.html")
        .then(res => res.text())
        .then(data => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>
      <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-img" src="" alt="Expanded Product" />
          </div>
  </body>
</html>
